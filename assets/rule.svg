    <circle cx="600" cy="23" r="5.5"/><path d="M 609.5 23.0 L 615.5 23.0"/><path d="M 606.7 29.7 L 611.0 34.0"/><path d="M 600.0 32.5 L 600.0 38.5"/><path d="M 593.3 29.7 L 589.0 34.0"/><path d="M 590.5 23.0 L 584.5 23.0"/><path d="M 593.3 16.3 L 589.0 12.0"/><path d="M 600.0 13.5 L 600.0 7.5"/><path d="M 606.7 16.3 L 611.0 12.0"/>
