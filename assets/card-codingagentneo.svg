  <text x="28" y="116" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="16.5" fill="#1F3B2C" opacity=".9">From scratch: agent loop, six tools,</text><text x="28" y="139" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="16.5" fill="#1F3B2C" opacity=".9">permissions, traces, SSE API, Vue GUI.</text>
