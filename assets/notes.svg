  <text x="56" y="100" font-family="'Courier New', 'Nimbus Mono PS', ui-monospace, monospace" font-size="12.5" fill="#1F3B2C" letter-spacing="3.2">AGENTS</text>
  <text x="56" y="129" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">Local-first coding agents — my own agent loop, tool protocol,</text>
  <text x="56" y="155" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">permission model and event trace. No framework in the middle.</text>
  <path d="M 56.6 183.3 L 126.2 183.6 L 195.3 183.2 L 266.0 183.5 L 335.3 182.5 L 404.9 183.7 L 474.2 182.7 L 545.2 182.9 L 614.0 182.7 L 684.8 182.8 L 753.9 183.2" stroke="#1F3B2C" stroke-width="0.9" opacity=".28" stroke-dasharray="2 6"/>
