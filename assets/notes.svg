  <text x="56" y="256" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">Websites and small apps I wanted for my own shooting: light &amp;</text>
  <text x="56" y="282" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">weather planning, RAW file handling. Built as much for how they</text>
  <text x="56" y="308" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">look and feel as for what they do.</text>
  <path d="M 55.5 336.3 L 126.0 336.0 L 195.2 336.4 L 265.8 336.0 L 335.2 335.6 L 404.3 335.8 L 474.9 335.4 L 545.0 335.6 L 614.0 335.4 L 684.9 336.3 L 754.5 336.2" stroke="#1F3B2C" stroke-width="0.9" opacity=".28" stroke-dasharray="2 6"/>
  <text x="56" y="380" font-family="'Courier New', 'Nimbus Mono PS', ui-monospace, monospace" font-size="12.5" fill="#1F3B2C" letter-spacing="3.2">SYSTEMS</text>
  <text x="56" y="409" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">Python and TypeScript by default; C++ / Metal only where it</text>
  <text x="56" y="435" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity=".92">actually pays off.</text>

