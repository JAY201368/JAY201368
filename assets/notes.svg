  <text x="56" y="139" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="21.5" fill="#1F3B2C" opacity="0.95">Local-first coding agents I build end to end: agent loop, tool</text>
  <text x="56" y="166" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="21.5" fill="#1F3B2C" opacity="0.95">protocol, permission model, event trace. Alongside that I study</text>
