  <text x="56" y="332" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="20.5" fill="#1F3B2C" opacity="0.9">Websites and small apps I wanted for my own shooting: light &amp;</text>
