<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 222" width="430" height="222" role="img"
     aria-label="HikariDaily: Weather newspaper: sun position, light windows, gear readings, a handbook.">

  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <g filter="url(#rough2)">
    <path d="M 8.2 7.8 L 62.2 7.3 L 116.7 8.7 L 170.4 7.2 L 224.0 7.6 L 277.4 9.0 L 333.1 7.0 L 386.8 8.2 L 421.7 7.5 L 422.4 61.9 L 422.4 116.4 L 421.2 170.6 L 423.1 215.1 L 368.3 213.0 L 312.9 213.2 L 261.0 213.5 L 205.7 214.9 L 151.6 214.1 L 97.9 213.0 L 44.2 214.8 L 7.2 213.4 L 7.8 158.9 L 8.0 106.7 L 8.4 52.1 Z" fill="#F4EBD5" stroke="#1F3B2C" stroke-width="1.7"/>
    <path d="M 15.3 15.4 L 69.9 14.4 L 122.2 15.6 L 176.7 14.8 L 231.6 14.4 L 285.8 15.0 L 338.2 15.8 L 393.1 14.2 L 415.6 15.5 L 415.5 69.3 L 415.9 122.1 L 415.9 177.3 L 414.5 207.2 L 360.7 207.3 L 307.4 207.0 L 252.2 206.8 L 198.6 207.5 L 145.8 207.5 L 91.1 206.4 L 37.4 206.6 L 15.9 206.4 L 15.9 152.1 L 15.5 98.7 L 15.1 44.8 Z" fill="none" stroke="#1F3B2C" stroke-width="0.7" opacity=".3"/>
  </g>
  <rect x="0" y="0" width="430" height="222" fill="#8a7a5c" filter="url(#grain)" opacity="0.05"/>

  <text x="28" y="36" font-family="'Courier New', 'Nimbus Mono PS', ui-monospace, monospace" font-size="10.5" fill="#A9472B" letter-spacing="2">PHOTO APP</text>
  <text x="28" y="84" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="30" fill="#1F3B2C" letter-spacing="0.4">HikariDaily</text>

  <text x="28" y="116" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="16.5" fill="#1F3B2C" opacity=".9">Weather newspaper: sun position, light</text><text x="28" y="139" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif" font-size="16.5" fill="#1F3B2C" opacity=".9">windows, gear readings, a handbook.</text>
  <rect x="28" y="170" width="83" height="20" rx="3" fill="none" stroke="#1F3B2C" stroke-width="1.1" opacity=".6" filter="url(#rough)"/><text x="70" y="184" text-anchor="middle" font-family="'Courier New', 'Nimbus Mono PS', ui-monospace, monospace" font-size="10.5" fill="#1F3B2C" opacity=".8" letter-spacing=".8">TypeScript</text>
  <text x="400" y="184" text-anchor="end" font-family="'Courier New', 'Nimbus Mono PS', ui-monospace, monospace" font-size="10.5" fill="#A9472B" letter-spacing="1.2">live ↗</text>

